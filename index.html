<!DOCTYPE html>
<html lang="pt-BR" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Painel Web Rádio Live</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --panel-color: #202024;
            --primary: #00b37e;
            --danger: #f75a68;
            --text: #e1e1e6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-color);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #29292e;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .status-badge {
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            background: #29292e;
        }
        .status-badge.online {
            background: var(--danger);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .screen { display: none; }
        .screen.active { display: block; }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .btn-danger { background: var(--danger); }
        .control-group {
            background: #29292e;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .slot-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 10px;
        }
        .slot-row input[type="range"] { flex: 1; }
        input[type="password"], input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #121214;
            border: 1px solid #29292e;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>📻 Minha Rádio Web</h2>
        <div id="statusBadge" class="status-badge">OFFLINE</div>
    </div>
    
    <div style="margin-bottom: 15px; text-align: right;">
        👥 Ouvintes: <span id="contadorOuvintes" style="font-weight:bold; color:var(--primary);">0</span>
    </div>

    <!-- TELA 1: SELEÇÃO DE PERFIL -->
    <div id="screenAuth" class="screen active">
        <h3>Escolha seu perfil:</h3>
        <button class="btn" onclick="escolherPerfil('ouvinte')">Entrar como Ouvinte</button>
        <button class="btn" style="background:#4839d3;" onclick="mostrarLoginLocutor()">Acessar Painel de Locução</button>
        
        <div id="loginForm" style="display:none; margin-top:15px;">
            <label>Senha do Locutor:</label>
            <input type="password" id="senhaInput" placeholder="Digite a senha...">
            <button class="btn" onclick="verificarSenha()">Confirmar Senha</button>
        </div>
    </div>

    <!-- TELA 2: PAINEL DO LOCUTOR -->
    <div id="screenLocutor" class="screen">
        <div style="display:flex; gap:10px;">
            <button id="btnIniciar" class="btn" onclick="iniciarTransmissao()">🔴 INICIAR TRANSMISSÃO</button>
            <button id="btnFinalizar" class="btn btn-danger" onclick="finalizarTransmissao()" disabled>⬛ FINALIZAR</button>
        </div>

        <div class="control-group">
            <h4>🎙️ Microfone do Locutor</h4>
            <button id="btnMic" class="btn" style="background:#4839d3;" onclick="alternarMicrofone()">Ativar Microfone</button>
        </div>

        <div class="control-group">
            <h4>🎵 Músicas (Até 5 Slots)</h4>
            <div id="musicasContainer"></div>
        </div>

        <div class="control-group">
            <h4>⚡ Efeitos Sonoros (Até 5 Slots)</h4>
            <div id="efeitosContainer"></div>
        </div>
    </div>

    <!-- TELA 3: PAINEL DO OUVINTE -->
    <div id="screenOuvinte" class="screen">
        <h3>Player do Ouvinte</h3>
        <p id="playerStatus">Aguardando a transmissão iniciar...</p>
        <div class="control-group">
            <label>Volume do Áudio:</label>
            <input type="range" id="volumeOuvinte" min="0" max="1" step="0.1" value="1" oninput="ajustarVolumeOuvinte(this.value)">
        </div>
    </div>
</div>

<script>
    const socket = io();
    let perfilAtual = '';
    const SENHA_CORRETA = "1234";
    
    let audioCtx;
    let destMixer;
    let mediaRecorder;
    let micStream;
    let micSource;

    socket.on('contador-atualizado', (qtd) => {
        document.getElementById('contadorOuvintes').innerText = qtd;
    });

    socket.on('status-radio', (status) => {
        const badge = document.getElementById('statusBadge');
        if(status.noAr) {
            badge.innerText = "NO AR";
            badge.classList.add('online');
            if(perfilAtual === 'ouvinte') iniciarAudioOuvinte();
        } else {
            badge.innerText = "OFFLINE";
            badge.classList.remove('online');
            if(perfilAtual === 'ouvinte') pararAudioOuvinte();
        }
    });

    function escolherPerfil(perfil) {
        perfilAtual = perfil;
        document.getElementById('screenAuth').classList.remove('active');
        if(perfil === 'ouvinte') {
            document.getElementById('screenOuvinte').classList.add('active');
        }
    }

    function mostrarLoginLocutor() {
        document.getElementById('loginForm').style.display = 'block';
    }

    function verificarSenha() {
        const senha = document.getElementById('senhaInput').value;
        if(senha === SENHA_CORRETA) {
            perfilAtual = 'locutor';
            document.getElementById('screenAuth').classList.remove('active');
            document.getElementById('screenLocutor').classList.add('active');
            inicializarEstruturaLocutor();
            socket.emit('registrar-locutor');
        } else {
            alert("Senha incorreta!");
        }
    }

    function inicializarEstruturaLocutor() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        destMixer = audioCtx.createMediaStreamDestination();

        const musContainer = document.getElementById('musicasContainer');
        musContainer.innerHTML = '';
        for(let i=1; i<=5; i++) {
            musContainer.innerHTML += `
                <div class="slot-row">
                    <span>Música ${i}:</span>
                    <input type="file" accept="audio/*" onchange="carregarAudio(this, 'musica', ${i})">
                    <input type="range" min="0" max="1" step="0.1" value="0.7" id="vol-musica-${i}" oninput="atualizarVolume('musica', ${i}, this.value)" style="display:none;">
                </div>`;
        }

        const efContainer = document.getElementById('efeitosContainer');
        efContainer.innerHTML = '';
        for(let i=1; i<=5; i++) {
            efContainer.innerHTML += `
                <div class="slot-row">
                    <span>Efeito ${i}:</span>
                    <input type="file" accept="audio/*" onchange="carregarAudio(this, 'efeito', ${i})">
                    <button class="btn" style="width:auto; padding:5px 10px; display:none;" id="btn-ef-${i}">⚡ Disparar</button>
                    <input type="range" min="0" max="1" step="0.1" value="1" id="vol-efeito-${i}" oninput="atualizarVolume('efeito', ${i}, this.value)" style="display:none;">
                </div>`;
        }
    }

    const audioNodes = { musica: {}, efeito: {} };

    function carregarAudio(input, tipo, index) {
        const file = input.files;
        if(!file) return;
        const url = URL.createObjectURL(file);
        
        const audio = new Audio(url);
        audio.crossOrigin = "anonymous";
        
        const source = audioCtx.createMediaElementSource(audio);
        const gainNode = audioCtx.createGain();
        
        source.connect(gainNode);
        gainNode.connect(destMixer);
        gainNode.connect(audioCtx.destination);

        audioNodes[tipo][index] = { audio, gain: gainNode };

        if(tipo === 'musica') {
            input.style.display = 'none';
            const volSlider = document.getElementById(`vol-musica-${index}`);
            volSlider.style.display = 'inline';
            const pai = volSlider.parentNode;
            pai.innerHTML = `<span>Mús ${index}</span> <button class="btn" style="width:auto; padding:5px; margin-bottom:0;" onclick="audioNodes.musica[${index}].audio.paused ? audioNodes.musica[${index}].audio.play() : audioNodes.musica[${index}].audio.pause()">⏯️ Play/Pause</button>` + pai.innerHTML;
        } else {
            input.style.display = 'none';
            document.getElementById(`vol-efeito-${index}`).style.display = 'inline';
            const btnEf = document.getElementById(`btn-ef-${index}`);
            btnEf.style.display = 'inline';
            btnEf.onclick = () => {
                audioNodes.efeito[index].audio.currentTime = 0;
